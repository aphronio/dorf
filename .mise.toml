[tools]
go = "1.26.5"
sqlc = "1.31.1"
"github:earendil-works/absurd" = { version = "0.5.0", asset_pattern = "absurdctl" }
"aqua:golangci/golangci-lint" = "2.13.1"
"aqua:lycheeverse/lychee" = "0.24.2"
"go:github.com/fzipp/gocyclo/cmd/gocyclo" = "0.6.0"

[env]
DORF_TEST_DATABASE_URL = { default = "postgresql://postgres:postgres@127.0.0.1:55432/dorf_test?sslmode=disable" }

[tasks."db:init"]
description = "Initialize the disposable development database"
run = """
if ! absurdctl schema-version -d "$DORF_TEST_DATABASE_URL" >/dev/null 2>&1; then
  absurdctl init -d "$DORF_TEST_DATABASE_URL"
fi
DORF_DATABASE_URL="$DORF_TEST_DATABASE_URL" go run ./cmd/dorf migrate
"""

[tasks.build]
description = "Build the Dorf binary"
run = """
mkdir -p .dorf/bin
go build -o .dorf/bin/dorf ./cmd/dorf
"""

[tasks."sql:generate"]
description = "Generate private PostgreSQL query code"
run = "sqlc generate"

[tasks."sql:check"]
description = "Fail when generated PostgreSQL query code is stale"
run = "sqlc diff"

[tasks."sql:vet"]
description = "Prepare every query against the migrated test database"
run = "sqlc vet"

[tasks."brand:generate"]
description = "Regenerate the terminal brand lockup from the canonical assets"
run = "go run ./cmd/dorf-brand-terminal"

[tasks."brand:check"]
description = "Fail when the generated terminal brand lockup is stale"
run = "go run ./cmd/dorf-brand-terminal --check"

[tasks."decisions:generate"]
description = "Regenerate the decision guides from authoritative decision records"
run = "go run ./cmd/dorf-decision-index"

[tasks."decisions:check"]
description = "Fail when decision metadata or generated guides are invalid or stale"
run = "go run ./cmd/dorf-decision-index --check"

[tasks."docs:check"]
description = "Check decision records and local documentation links"
depends = ["decisions:check"]
run = "lychee --offline --include-fragments --no-progress --extensions md ."

[tasks."test:fast"]
description = "Run Go tests without PostgreSQL-backed cases"
run = "DORF_TEST_DATABASE_URL= go test ./..."

[tasks."test:postgres"]
description = "Run PostgreSQL-backed package tests without the Go test cache"
run = "go test -count=1 ./internal/postgres ./cmd/dorf"

[tasks."integration:compose-vm"]
description = "Refresh or run the disposable Ubuntu Compose deployment proof"
run = "scripts/integration/compose-vm.sh"

[tasks.lint]
description = "Run the repository's blocking Go static analysis"
run = "golangci-lint run"

[tasks.complexity]
description = "Reject new, increased, or unrecorded Go complexity"
run = "scripts/check-go-complexity.sh check"

[tasks."complexity:report"]
description = "Rank authored production Go functions above the complexity limit"
run = "scripts/check-go-complexity.sh report"

[tasks."complexity:update"]
description = "Record decreases to the Go complexity baseline"
run = "scripts/check-go-complexity.sh update"

[tasks.check]
description = "Run the repository's deterministic SQL and Go checks"
depends = ["docs:check"]
run = """
sqlc diff
sqlc vet
scripts/incus/check-image-inputs.sh
go run ./cmd/dorf-brand-terminal --check
bash scripts/integration/compose-vm-test.sh
go test ./...
golangci-lint run
scripts/check-go-complexity.sh check
go vet ./...
"""
