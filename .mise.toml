[tools]
go = "1.26.5"
sqlc = "1.31.1"
"github:earendil-works/absurd" = { version = "0.5.0", asset_pattern = "absurdctl" }

[tasks.setup]
description = "Converge the repository development environment"
run = "scripts/dev/setup.sh"

[tasks."sql:generate"]
description = "Generate private PostgreSQL query code"
run = "sqlc generate"

[tasks."sql:check"]
description = "Fail when generated PostgreSQL query code is stale"
run = "sqlc diff"

[tasks."sql:vet"]
description = "Prepare every query against the migrated test database"
run = "sqlc vet"

[tasks."brand:generate"]
description = "Regenerate the terminal brand lockup from the canonical assets"
run = "go run ./cmd/dorf-brand-terminal"

[tasks."brand:check"]
description = "Fail when the generated terminal brand lockup is stale"
run = "go run ./cmd/dorf-brand-terminal --check"

[tasks.check]
description = "Run the repository's deterministic SQL and Go checks"
run = """
if [ -z "${DORF_TEST_DATABASE_URL:-}" ] && [ -f .dorf/test-database-url ]; then
  export DORF_TEST_DATABASE_URL="$(cat .dorf/test-database-url)"
fi
: "${DORF_TEST_DATABASE_URL:?run scripts/dev/setup.sh or set DORF_TEST_DATABASE_URL}"
sqlc diff
sqlc vet
go run ./cmd/dorf-brand-terminal --check
go test ./...
go vet ./...
"""
