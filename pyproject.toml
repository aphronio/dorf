[project]
name = "dorf"
version = "0.1.2"
description = "Control plane for durable AI workers on infrastructure you control"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai-agents", "agent-runtime", "automation", "codex", "control-plane", "incus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/aphronio/dorf"
Repository = "https://github.com/aphronio/dorf"
Issues = "https://github.com/aphronio/dorf/issues"
Documentation = "https://github.com/aphronio/dorf/blob/main/docs/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/dorf",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dorf"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "twine>=6.2.0,<7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
