version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/postgres/migrations"
    queries: "internal/postgres/queries"
    strict_function_checks: true
    strict_order_by: true
    database:
      uri: "${DORF_TEST_DATABASE_URL}"
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: "dbsql"
        out: "internal/postgres/dbsql"
        sql_package: "database/sql"
        omit_unused_structs: true
        initialisms:
          - id
          - url
          - oid
          - pr
        overrides:
          - column: "dorf.sessions.cleanup_state"
            go_type:
              import: "github.com/aphronio/dorf/internal/core"
              type: "CleanupState"
          - column: "dorf.actions.kind"
            go_type:
              import: "github.com/aphronio/dorf/internal/core"
              type: "ActionKind"
          - column: "dorf.actions.state"
            go_type:
              import: "github.com/aphronio/dorf/internal/core"
              type: "ActionState"
