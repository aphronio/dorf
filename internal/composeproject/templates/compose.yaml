name: dorf

services:
  postgres:
    image: "${DORF_POSTGRES_IMAGE_ID}"
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DORF_POSTGRES_DB}"
      POSTGRES_USER: "${DORF_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${DORF_POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${DORF_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - database
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
      dev.dorf.release: "${DORF_RELEASE}"

  migrate:
    image: "${DORF_IMAGE_ID}"
    pull_policy: never
    command: ["migrate"]
    user: "${DORF_UID}:${DORF_GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    environment:
      XDG_CONFIG_HOME: "/var/lib/dorf/.config"
      XDG_DATA_HOME: "/var/lib/dorf/.local/share"
      XDG_STATE_HOME: "/var/lib/dorf/.local/state"
      DORF_DATABASE_URL: "${DORF_DATABASE_URL}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
      dev.dorf.release: "${DORF_RELEASE}"

  worker:
    image: "${DORF_IMAGE_ID}"
    pull_policy: never
    command: ["worker"]
    user: "${DORF_UID}:${DORF_GID}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      XDG_CONFIG_HOME: "/var/lib/dorf/.config"
      XDG_DATA_HOME: "/var/lib/dorf/.local/share"
      XDG_STATE_HOME: "/var/lib/dorf/.local/state"
      DORF_DATABASE_URL: "${DORF_DATABASE_URL}"
      E2B_API_KEY: "${E2B_API_KEY:-}"
{{if .Gateway}}      DORF_PROVIDER_GATEWAY_INTERNAL_ORIGIN: "http://provider-gateway:8317"
{{end}}{{if .IncusSocket}}    group_add:
      - "${DORF_INCUS_SOCKET_GID}"
{{end}}    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - type: bind
        source: "${DORF_CONFIG_DIR}"
        target: /var/lib/dorf/.config/dorf
        read_only: true
      - type: bind
        source: "${DORF_DATA_DIR}"
        target: /var/lib/dorf/.local/share/dorf
      - type: bind
        source: "${DORF_STATE_DIR}"
        target: /var/lib/dorf/.local/state/dorf
{{if .IncusSocket}}      - type: bind
        source: "${DORF_INCUS_SOCKET}"
        target: "${DORF_INCUS_SOCKET}"
        read_only: true
        bind:
          create_host_path: false
{{end}}    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - application
      - database
      - worker-egress
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
      dev.dorf.release: "${DORF_RELEASE}"

  control-reader:
    image: "${DORF_IMAGE_ID}"
    pull_policy: never
    command: ["serve", "--control-reader", "--listen", "0.0.0.0:8756", "--allow-container-listen"]
    user: "${DORF_UID}:${DORF_GID}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/dorf", "_compose-control-reader-health"]
      interval: 2s
      timeout: 5s
      retries: 15
    environment:
      XDG_CONFIG_HOME: "/var/lib/dorf/.config"
      XDG_DATA_HOME: "/var/lib/dorf/.local/share"
      XDG_STATE_HOME: "/var/lib/dorf/.local/state"
      DORF_DATABASE_URL: "${DORF_DATABASE_URL}"
      DORF_CONTROL_READER_TOKEN: "${DORF_CONTROL_READER_TOKEN}"
      E2B_API_KEY: "${E2B_API_KEY:-}"
{{if .Gateway}}      DORF_PROVIDER_GATEWAY_INTERNAL_ORIGIN: "http://provider-gateway:8317"
{{end}}{{if .IncusSocket}}    group_add:
      - "${DORF_INCUS_SOCKET_GID}"
{{end}}    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - type: bind
        source: "${DORF_CONFIG_DIR}"
        target: /var/lib/dorf/.config/dorf
        read_only: true
      - type: bind
        source: "${DORF_DATA_DIR}"
        target: /var/lib/dorf/.local/share/dorf
        read_only: true
{{if .IncusSocket}}      - type: bind
        source: "${DORF_INCUS_SOCKET}"
        target: "${DORF_INCUS_SOCKET}"
        read_only: true
        bind:
          create_host_path: false
{{end}}    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      database:
      provider:
      reader:
        aliases:
          - control-reader-rpc
      reader-egress:
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
      dev.dorf.release: "${DORF_RELEASE}"

  control-api:
    image: "${DORF_IMAGE_ID}"
    pull_policy: never
    command: ["serve", "--listen", "0.0.0.0:8745", "--allow-container-listen"]
    user: "${DORF_UID}:${DORF_GID}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      XDG_CONFIG_HOME: "/var/lib/dorf/.config"
      XDG_DATA_HOME: "/var/lib/dorf/.local/share"
      XDG_STATE_HOME: "/var/lib/dorf/.local/state"
      DORF_DATABASE_URL: "${DORF_DATABASE_URL}"
      DORF_CONTROL_READER_ORIGIN: "http://control-reader-rpc:8756"
      DORF_CONTROL_READER_TOKEN: "${DORF_CONTROL_READER_TOKEN}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    ports:
      - "127.0.0.1:8745:8745"
    volumes:
      - type: bind
        source: "./control-config"
        target: /var/lib/dorf/.config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DORF_STATE_DIR}"
        target: /var/lib/dorf/.local/state/dorf
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      control-reader:
        condition: service_healthy
    networks:
      - database
      - reader
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
      dev.dorf.release: "${DORF_RELEASE}"
{{if .Gateway}}  provider-gateway:
    image: "${DORF_IMAGE_ID}"
    pull_policy: never
    command: ["_compose-provider-gateway"]
    user: "${DORF_UID}:${DORF_GID}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DORF_PROVIDER_GATEWAY_STATE: "{{.GatewayStatePath}}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    ports:
      - "${DORF_PROVIDER_GATEWAY_PUBLISH}:8317:8317"
    volumes:
      - type: bind
        source: "${DORF_PROVIDER_GATEWAY_HOST_STATE_PATH}"
        target: "{{.GatewayStatePath}}"
    networks:
      - application
      - ingress
      - provider
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
      dev.dorf.release: "${DORF_RELEASE}"
      dev.dorf.config-digest: "${DORF_PROVIDER_GATEWAY_DIGEST}"

{{if .Cloudflare}}  cloudflared:
    image: "${DORF_IMAGE_ID}"
    pull_policy: never
    command: ["_compose-cloudflared"]
    user: "${DORF_UID}:${DORF_GID}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DORF_CLOUDFLARE_STATE: "{{.CloudflareStatePath}}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - type: bind
        source: "${DORF_CLOUDFLARE_HOST_STATE_PATH}"
        target: "{{.CloudflareStatePath}}"
        read_only: true
    depends_on:
      provider-gateway:
        condition: service_started
    networks:
      - ingress
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
      dev.dorf.release: "${DORF_RELEASE}"
      dev.dorf.config-digest: "${DORF_CLOUDFLARE_DIGEST}"
{{end}}{{end}}
volumes:
  postgres-data:
    name: dorf-postgres-data
    external: true

networks:
  application:
    internal: true
    driver: bridge
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
  database:
    internal: true
    driver: bridge
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
  reader:
    internal: true
    driver: bridge
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
  reader-egress:
    driver: bridge
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
  provider:
    internal: true
    driver: bridge
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
  worker-egress:
    driver: bridge
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
  ingress:
    driver: bridge
    labels:
      dev.dorf.owner: deployment
      dev.dorf.project-version: "${DORF_PROJECT_VERSION}"
