<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dorf keys</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
  body { max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
  button, input { font: inherit; padding: 0.4rem 0.7rem; }
  input { width: 100%; box-sizing: border-box; margin: 0.5rem 0; }
  .muted { opacity: 0.7; }
  .error { color: #c33; }
</style>
<h1>Dorf keys</h1>
<p class="muted">Dorf's agent never holds these keys; the broker adds them to its requests. Paste a sign-in code only on this page, never in a Thread.</p>
<h2>Claude plan</h2>
<p id="status">Loading…</p>
<button id="connect" hidden>Connect Claude</button>
<div id="step" hidden>
  <p><a id="link" target="_blank" rel="noopener noreferrer">1. Sign in on claude.com</a></p>
  <form id="form">
    <input id="code" placeholder="2. Paste the code claude.com shows" autocomplete="off" required>
    <button>Finish</button>
  </form>
</div>
<p id="error" class="error"></p>
<script src="/page.js"></script>
</html>
