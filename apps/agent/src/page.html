<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dorf</title>
<style>
:root{--bg:#fbf7ef;--card:#fff;--ink:#1f2420;--soft:#5d665f;--line:#e6dfd0;--moss:#3f7d4e;--moss-bg:#e7f2e8;--sun:#c9821f;--sun-bg:#fbefd9;--code:#f3efe6}
@media (prefers-color-scheme:dark){:root{--bg:#161a17;--card:#1f2520;--ink:#ebe7dc;--soft:#a3ab9f;--line:#333b34;--moss:#7cc38d;--moss-bg:#22352a;--sun:#e9ab52;--sun-bg:#3a2f1c;--code:#191e1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,sans-serif;height:100vh;display:flex}
aside{width:280px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#threads{flex:1;overflow:auto;padding:8px}
#threads a{display:block;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#threads a:hover{background:var(--bg)}#threads a.on{background:var(--moss-bg);color:var(--moss);font-weight:600}
#claude{border-top:1px solid var(--line);padding:12px 16px;font-size:14px}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.you{align-self:flex-end;background:var(--moss-bg);border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:80%;white-space:pre-wrap}
.say{white-space:pre-wrap;max-width:90%}
.call{font:13px/1.45 ui-monospace,monospace;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:0}
.call b{color:var(--moss)}.err{color:var(--sun)}
details{color:var(--soft);font-size:13px}summary{cursor:pointer}
.note{color:var(--soft);font-size:13px;text-align:center}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:40%}
textarea,input{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:none}
button,a.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 14px;background:var(--moss);color:var(--card);cursor:pointer;text-decoration:none;display:inline-block}
button.quiet{background:transparent;color:var(--soft);border:1px solid var(--line)}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--sun-bg);color:var(--sun)}.pill.ok{background:var(--moss-bg);color:var(--moss)}
[hidden]{display:none!important}
@media (max-width:700px){body{flex-direction:column;height:auto;min-height:100vh}aside{width:auto;border-right:0;border-bottom:1px solid var(--line)}#threads{max-height:30vh}main{min-height:70vh}}
</style>
</head>
<body>
<aside>
	<header><h1>Dorf</h1><button id="new">New</button></header>
	<nav id="threads"></nav>
	<div id="claude"></div>
</aside>
<main>
	<header><h1 id="title">New Thread</h1><span id="state" class="pill" hidden></span><button id="stop" class="quiet" hidden>Stop</button><button id="delete" class="quiet" hidden>Delete</button></header>
	<div id="log"><p class="note">Describe a coding task. It runs in a Linux machine of its own.</p></div>
	<form id="compose"><select id="repo" hidden><option value="">No repository</option></select><textarea id="text" rows="2" placeholder="What should Dorf do?"></textarea><button>Send</button></form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const h = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids.filter((k) => k != null)); return e; };
const api = async (method, path, body) => {
	const res = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body && JSON.stringify(body) });
	const data = res.status === 204 ? null : await res.json();
	if (!res.ok) throw new Error(data?.error ?? res.statusText);
	return data;
};
let current, stream, entries = [], live = {};

async function listThreads() {
	const items = await api("GET", "/threads");
	$("threads").replaceChildren(...items.slice().reverse().map((t) => h("a", { href: `#${t.id}`, textContent: t.repo ? `${t.repo.split("/")[1]}: ${t.title}` : t.title, className: t.id === current ? "on" : "" })));
	return items;
}

const text = (content) => typeof content === "string" ? content : (content ?? []).filter((c) => c.type === "text").map((c) => c.text).join("");
const tail = (s, n = 40) => { const lines = s.split("\n"); return lines.length > n ? `… ${lines.length - n} lines above\n${lines.slice(-n).join("\n")}` : s; };
const command = (call) => call.name === "bash" ? call.arguments?.command : `${call.name} ${JSON.stringify(call.arguments ?? {})}`;

function assistant(message, outputs = {}) {
	return (message.content ?? []).map((c) => {
		if (c.type === "text" && c.text.trim()) return h("div", { className: "say", textContent: c.text });
		if (c.type === "thinking" && c.thinking?.trim()) return h("details", {}, h("summary", { textContent: "thinking" }), h("div", { className: "say", textContent: c.thinking }));
		if (c.type === "toolCall") return h("pre", { className: "call" }, h("b", { textContent: "$ " }), command(c), outputs[c.id] ? `\n${tail(outputs[c.id])}` : "");
	}).concat(message.stopReason === "error" ? [h("div", { className: "err", textContent: message.errorMessage ?? "the model failed" })] : []);
}

function render() {
	const log = $("log");
	const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
	const rows = [];
	for (const e of entries) {
		const m = e.model?.[0];
		if (e.kind === "pi.user") rows.push(h("div", { className: "you", textContent: text(m?.content) }));
		else if (e.kind === "pi.assistant" && m) rows.push(...assistant(m));
		else if (e.kind === "pi.tool-result" && m) rows.push(h("pre", { className: `call${m.isError ? " err" : ""}`, textContent: tail(text(m.content)) || "(no output)" }));
		else if (e.kind === "pi.compaction") rows.push(h("p", { className: "note", textContent: "earlier conversation summarized" }));
	}
	const outputs = Object.fromEntries((live.tools ?? []).filter((t) => t.status !== "done").map((t) => [t.callId, t.output ?? "running…"]));
	if (live.generation?.message) rows.push(...assistant(live.generation.message, outputs));
	if (live.generation?.retry) rows.push(h("p", { className: "note", textContent: `retrying: ${live.generation.retry.error}` }));
	if (live.runFailure && !live.run) rows.push(h("div", { className: "err", textContent: `run ended: ${live.runFailure.reason}${live.runFailure.detail ? `, ${live.runFailure.detail}` : ""}` }));
	log.replaceChildren(...rows.filter(Boolean));
	if (atBottom) log.scrollTop = log.scrollHeight;
	const running = Boolean(live.run);
	$("state").hidden = false;
	$("state").textContent = running ? "working" : "idle";
	$("state").className = running ? "pill" : "pill ok";
	$("stop").hidden = !running;
}

async function open() {
	stream?.close();
	current = Number(location.hash.slice(1)) || undefined;
	entries = []; live = {};
	const items = await listThreads();
	const thread = items.find((t) => t.id === current);
	$("title").textContent = thread ? (thread.repo ? `${thread.repo} · ${thread.title}` : thread.title) : "New Thread";
	$("repo").hidden = Boolean(thread) || $("repo").options.length < 2;
	$("delete").hidden = !thread;
	$("stop").hidden = true; $("state").hidden = true;
	$("text").placeholder = thread ? "Reply…" : "What should Dorf do?";
	if (!thread) return $("log").replaceChildren(h("p", { className: "note", textContent: "Describe a coding task. It runs in a Linux machine of its own." }));
	$("log").replaceChildren(h("p", { className: "note", textContent: "loading…" }));
	stream = new EventSource(`/threads/${current}/events`);
	stream.onmessage = (m) => {
		const event = JSON.parse(m.data);
		if (event.entries) entries = event.entries.length && event.entries[0].id <= (entries.at(-1)?.id ?? 0) ? event.entries : entries.concat(event.entries);
		live = event.live ?? {};
		render();
	};
}

$("compose").onsubmit = async (ev) => {
	ev.preventDefault();
	const value = $("text").value.trim();
	if (!value) return;
	$("text").value = "";
	try {
		if (current) await api("POST", `/threads/${current}/messages`, { text: value });
		else {
			const repo = $("repo").value;
			try { localStorage.setItem("dorf.repo", repo); } catch {}
			location.hash = (await api("POST", "/threads", { prompt: value, ...(repo ? { repo } : {}) })).id;
		}
	} catch (e) { $("text").value = value; alert(e.message); }
};
$("text").onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("compose").requestSubmit(); } };
$("new").onclick = () => { location.hash = ""; $("text").focus(); };
$("stop").onclick = () => api("POST", `/threads/${current}/abort`).catch((e) => alert(e.message));
$("delete").onclick = async () => {
	if (!confirm("Delete this Thread and its machine?")) return;
	await api("DELETE", `/threads/${current}`).catch((e) => alert(e.message));
	location.hash = "";
};
window.onhashchange = open;

async function claude() {
	const box = $("claude");
	const s = await api("GET", "/claude").catch(() => ({ loggedIn: false }));
	if (s.loggedIn) return box.replaceChildren(h("span", { className: "pill ok", textContent: "Claude connected" }), " ", [s.email, s.plan && `${s.plan} plan`].filter(Boolean).join(" · "));
	const connect = h("button", { textContent: "Connect Claude" });
	const note = h("div", { className: "err" });
	box.replaceChildren(h("span", { className: "pill", textContent: "Claude not connected" }), h("p", { textContent: "Sign in on claude.com. Claude Code keeps the login; Dorf never sees it." }), connect, note);
	connect.onclick = async () => {
		try {
			const { url } = await api("POST", "/claude/login");
			const code = h("input", { placeholder: "Code from claude.com", autocomplete: "off" });
			const finish = h("button", { textContent: "Finish" });
			box.replaceChildren(h("a", { className: "btn", href: url, target: "_blank", rel: "noopener noreferrer", textContent: "1. Sign in with Claude" }), h("p", { textContent: "2. Paste the code it shows:" }), h("div", { style: "display:flex;gap:8px" }, code, finish), note);
			finish.onclick = async () => {
				try { await api("POST", "/claude/code", { code: code.value }); await claude(); } catch (e) { note.textContent = e.message; }
			};
		} catch (e) { note.textContent = e.message; }
	};
}

async function repos() {
	const list = await api("GET", "/repos").catch(() => []);
	$("repo").append(...list.map((r) => h("option", { value: r.name, textContent: r.name })));
	try { const last = localStorage.getItem("dorf.repo"); if (last && list.some((r) => r.name === last)) $("repo").value = last; } catch {}
	$("repo").hidden = Boolean(current) || !list.length;
}

open();
claude();
repos();
</script>
</body>
</html>
