[commands]
prepare = "UV_CACHE_DIR=.dorf/uv-cache uv sync --frozen --all-groups"
check = "UV_CACHE_DIR=.dorf/uv-cache uv run pytest && UV_CACHE_DIR=.dorf/uv-cache uv run ruff check ."
smoke = "UV_CACHE_DIR=.dorf/uv-cache uv run dorf --help"

[agent.codex]
model = "gpt-5.6-sol"
reasoning_effort = "low"

[review]
max_rounds = 3
timeout_seconds = 1800
prompt = """
Review git diff {target_start_sha}...HEAD with a strict code-review rubric.
Focus on correctness, regressions, security, missing tests, and edge cases.
Return actionable findings if any.
"""

[review.agents.codex]
enabled = true
command = "codex exec -s read-only -c model='\"gpt-5.6-sol\"' -c model_reasoning_effort='\"high\"' {dorf_review_prompt}"

[review.agents.droid]
enabled = false
command = "droid exec --auto high --model kimi-k2.7-code --reasoning-effort high {dorf_review_prompt}"

[verification.roles.diff]
harness = "pi"
connection = "deepseek"
model = "deepseek-v4-flash"
reasoning_effort = "max"
authority = "shadow"
room = "dedicated"
timeout_seconds = 1800
prompt = """
Review the exact implementation diff with a strict diff-correctness rubric.
Focus on correctness, regressions, unsafe authority, missing tests, and edge cases.
Return actionable findings if any.
"""

[incus]
template = "dorf-codex"
