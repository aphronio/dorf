[commands]
prepare = "scripts/dev/setup.sh"
check = ".dorf/bin/mise run check"
smoke = "mkdir -p .dorf/bin && .dorf/bin/mise exec -- go build -o .dorf/bin/dorf ./cmd/dorf && .dorf/bin/dorf version && .dorf/bin/mise exec -- go version -m .dorf/bin/dorf"

[agent.codex]
model = "gpt-5.6-sol"
reasoning_effort = "low"

[incus]
template = "dorf-codex"
