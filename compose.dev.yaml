name: dorf-dev

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: dorf_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dorf_test"]
      interval: 2s
      timeout: 3s
      retries: 15

