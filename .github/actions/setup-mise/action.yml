name: Set up the Dorf toolchain
description: Install the repository's pinned Mise and locked tools

runs:
  using: composite
  steps:
    - name: Install Mise and locked tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.8.5
        sha256: ee362b6d96c648e27325a8bc7ee866bde4fffc20c88c777c5eb5c3b5c6f3e226
        # mise-action automatically enables locked mode when mise.lock is present.
