name: Publish official Room image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: official-room-image
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: [self-hosted, linux, x64, dorf-image]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROVIDER_CONNECTION: ${{ vars.DORF_IMAGE_PROVIDER_CONNECTION }}
      SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Select the runner-local output directory
        run: echo "OUTPUT_DIR=$RUNNER_TEMP/dorf-room-image" >> "$GITHUB_ENV"

      - name: Require the public immutable-release boundary
        env:
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.DORF_IMMUTABLE_RELEASES_ENABLED }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)" = "public"
          test "$IMMUTABLE_RELEASES_ENABLED" = "true"
          test -n "$PROVIDER_CONNECTION"

      - name: Check out the candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Skip an unchanged Codex release on the schedule
        id: promotion
        run: |
          latest_codex="$(npm view @openai/codex@latest version)"
          if [[ "$GITHUB_EVENT_NAME" = "schedule" ]] &&
             gh release list --limit 100 --json tagName --jq '.[].tagName' |
               grep -Fq -- "-$latest_codex"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and validate the latest Codex candidate
        if: steps.promotion.outputs.skip != 'true'
        run: scripts/incus/prepare-dorf-codex-release.sh

      - name: Create the complete draft release
        if: steps.promotion.outputs.skip != 'true'
        id: release
        run: |
          release_tag="$(jq -r .release_tag "$OUTPUT_DIR/dorf-codex-x86_64.json")"
          gh release create "$release_tag" \
            --draft \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Dorf Room image · $release_tag" \
            --notes "Credential-free Incus VM image promoted after a real Dorf Codex turn." \
            "$OUTPUT_DIR/dorf-codex-x86_64.tar.gz" \
            "$OUTPUT_DIR/dorf-codex-x86_64.json"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish and verify the immutable release
        if: steps.promotion.outputs.skip != 'true'
        run: |
          gh release edit "${{ steps.release.outputs.tag }}" \
            --draft=false \
            --latest=false
          gh release verify "${{ steps.release.outputs.tag }}"
          gh release verify-asset \
            "${{ steps.release.outputs.tag }}" \
            "$OUTPUT_DIR/dorf-codex-x86_64.tar.gz"
          gh release verify-asset \
            "${{ steps.release.outputs.tag }}" \
            "$OUTPUT_DIR/dorf-codex-x86_64.json"
