name: CI

on:
  pull_request:
  push:
    branches: [main, greenfield]

permissions:
  contents: read

jobs:
  go:
    name: Go application
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dorf_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dorf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DORF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dorf_test?sslmode=disable
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the repository
        run: scripts/dev/setup.sh
      - name: Check SQL generation and live behavior
        run: .dorf/bin/mise run check
      - name: Build supported release artifact
        run: .dorf/bin/mise exec -- scripts/build-release.sh dist/release
      - name: Test release installer
        run: bash scripts/install-test.sh dist/release/install.sh dist/release
      - name: Check generated installer
        run: |
          test -x dist/release/install.sh
          sh -n dist/release/install.sh
          bash -n scripts/release.sh
          bash -n scripts/incus/release-dorf-image.sh
          bash -n scripts/incus/check-image-inputs.sh
      - name: Smoke installed artifact
        run: |
          archive="$(find dist/release -maxdepth 1 -name 'dorf_*_linux_x86_64.tar.gz' -print -quit)"
          test -n "$archive"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_dir"' EXIT
          tar -xzf "$archive" -C "$smoke_dir"
          "$smoke_dir/dorf" version
          .dorf/bin/mise exec -- go version -m "$smoke_dir/dorf"
