apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: dorf-agent, namespace: dorf-gate}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
# No Service: the API listens on the pod's loopback, so only a port-forward behind `tailscale serve`
# reaches it, and the Tailscale login header can be trusted.
apiVersion: apps/v1
kind: Deployment
metadata: {name: dorf-agent, namespace: dorf-gate}
spec:
  selector: {matchLabels: {app: dorf-agent}}
  # One SQLite file, one writer.
  strategy: {type: Recreate}
  template:
    metadata: {labels: {app: dorf-agent}}
    spec:
      serviceAccountName: dorf-agent
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000}
      containers:
      - name: agent
        image: ${AGENT_IMAGE}
        env:
        - {name: DORF_MODEL, value: "${DORF_MODEL}"}
        - {name: DORF_OWNER, value: "${DORF_OWNER}"}
        - {name: DORF_GATE, value: http://dorf-gate}
        - {name: DORF_TOKEN_FILE, value: /run/dorf/token/token}
        - {name: DORF_DATA, value: /data}
        - {name: HOME, value: /data}
        - {name: DORF_BROKER, value: http://broker.dorf-broker}
        - {name: DORF_GITHUB, value: "${DORF_GITHUB}"}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: token, mountPath: /run/dorf/token, readOnly: true}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: dorf-agent}
      - name: token
        projected:
          sources:
          - serviceAccountToken: {audience: dorf-gate, expirationSeconds: 3600, path: token}
---
# The agent reaches only DNS, the gate and the broker: Thread-written code runs here, and the cluster's image registry
# and every other in-cluster service would otherwise be one request away.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dorf-agent, namespace: dorf-gate}
spec:
  podSelector: {matchLabels: {app: dorf-agent}}
  policyTypes: [Egress]
  egress:
  - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
    ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
  - to: [{podSelector: {matchLabels: {app: dorf-gate}}}]
    ports: [{port: 8080}]
  - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: dorf-broker}}, podSelector: {matchLabels: {app: broker}}}]
    ports: [{port: 8080}]
