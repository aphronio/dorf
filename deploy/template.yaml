metadata: {atespace: dorf, name: "${TEMPLATE}"}
workerSelector: {matchLabels: {workload: dorf-sandbox}}
containers:
- name: sandbox
  image: ${IMAGE}
  wakeupProbe: {httpGet: {path: /readyz, port: 80}}
  volumeMounts:
  - {name: system-info, mountPath: /run/ate/egress-trust-bundle}
volumes:
- name: system-info
  systemInfo:
    dataSources:
    - trustBundle:
        names: [egress-mitm.ate.dev, system-roots.ate.dev]
        path: trust-bundle.pem
resources: {limits: {cpuMillicores: 2000, memoryBytes: 4294967296}}
snapshotConfig: {preferredFidelity: SNAPSHOT_FIDELITY_MEMORY}
