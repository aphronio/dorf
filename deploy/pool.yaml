apiVersion: v1
kind: Namespace
metadata:
  name: dorf
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: sandbox
  namespace: dorf
  labels:
    workload: dorf-sandbox
spec:
  replicas: 2
  workerImage: ${WORKER_IMAGE}
  sandboxClasses:
  - name: gvisor
    configRef:
      name: gvisor-default
  template:
    resources:
      limits: {cpu: "4", memory: 4Gi}
      requests: {cpu: 250m, memory: 4Gi}
