# The agent holds no key: it calls the broker, and the broker adds the Claude plan's token or the GitHub token on the
# few routes the agent needs. Agent code can use a key through these routes but cannot read it or send it elsewhere.
# The keys service (deploy/keys.yaml) writes the Claude token; up.sh writes the GitHub one.
apiVersion: v1
kind: Namespace
metadata: {name: dorf-broker}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: broker, namespace: dorf-broker}
data:
  envoy.yaml: |
    node: {id: broker, cluster: dorf}
    static_resources:
      listeners:
      - name: broker
        address: {socket_address: {address: 0.0.0.0, port_value: 8080}}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: broker
              # Routes match the path Anthropic and GitHub will see, so dot segments or encoded slashes cannot widen one.
              normalize_path: true
              merge_slashes: true
              path_with_escaped_slashes_action: REJECT_REQUEST
              # Each key is added only on the routes that switch its filter on. Envoy reloads a key when its Secret changes.
              http_filters:
              - name: claude
                disabled: true
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                  overwrite: true
                  credential:
                    name: envoy.http.injected_credentials.generic
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                      header: Authorization
                      credential: {name: claude, sds_config: {path_config_source: {path: /etc/broker-keys/claude.yaml, watched_directory: {path: /etc/broker-keys}}}}
              - name: github
                disabled: true
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                  overwrite: true
                  credential:
                    name: envoy.http.injected_credentials.generic
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                      header: Authorization
                      credential: {name: github, sds_config: {path_config_source: {path: /etc/broker-keys/github.yaml, watched_directory: {path: /etc/broker-keys}}}}
              - name: envoy.filters.http.router
                typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
              route_config:
                virtual_hosts:
                - name: broker
                  domains: ["*"]
                  routes:
                  # Claude Code's model requests; it sends a placeholder token, replaced here.
                  - match: {path: /v1/messages, headers: [{name: ":method", string_match: {exact: POST}}]}
                    route: {cluster: anthropic, host_rewrite_literal: api.anthropic.com, timeout: 0s}
                    typed_per_filter_config: {claude: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}}
                  - match: {path: /v1/messages/count_tokens, headers: [{name: ":method", string_match: {exact: POST}}]}
                    route: {cluster: anthropic, host_rewrite_literal: api.anthropic.com}
                    typed_per_filter_config: {claude: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}}
                  # Claude Code's reachability check, without a token.
                  - match: {path: /api/hello, headers: [{name: ":method", string_match: {exact: HEAD}}]}
                    route: {cluster: anthropic, host_rewrite_literal: api.anthropic.com}
                  # The repositories the page offers for a new Thread.
                  - match: {path: /user/repos, headers: [{name: ":method", string_match: {exact: GET}}]}
                    route: {cluster: github, host_rewrite_literal: api.github.com}
                    typed_per_filter_config: {github: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}}
                  - match: {prefix: /}
                    direct_response: {status: 403, body: {inline_string: "not a brokered route\n"}}
      clusters:
      - name: anthropic
        type: LOGICAL_DNS
        dns_lookup_family: V4_PREFERRED
        load_assignment: {cluster_name: anthropic, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: api.anthropic.com, port_value: 443}}}}]}]}
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: api.anthropic.com
            common_tls_context:
              validation_context:
                trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
                match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: api.anthropic.com}}]
      - name: github
        type: LOGICAL_DNS
        dns_lookup_family: V4_PREFERRED
        load_assignment: {cluster_name: github, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: api.github.com, port_value: 443}}}}]}]}
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: api.github.com
            common_tls_context:
              validation_context:
                trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
                match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: api.github.com}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: broker, namespace: dorf-broker}
spec:
  selector: {matchLabels: {app: broker}}
  template:
    metadata:
      labels: {app: broker}
      # A changed config restarts the broker, since Envoy reads it once; keys reload on their own.
      annotations: {dorf.dev/config: "${BROKER_CONFIG}"}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101}
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.36.2@sha256:4972515dd9a069b44beb43cebba7851596e72a8c61cd7a7c33d8f48efc5280ba
        args: [-c, /etc/broker/envoy.yaml, --log-level, warn]
        ports: [{containerPort: 8080}]
        readinessProbe: {tcpSocket: {port: 8080}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
        volumeMounts:
        - {name: config, mountPath: /etc/broker, readOnly: true}
        - {name: keys, mountPath: /etc/broker-keys, readOnly: true}
      volumes:
      - name: config
        configMap: {name: broker}
      - name: keys
        projected:
          sources:
          - secret: {name: claude, items: [{key: sds.yaml, path: claude.yaml}]}
          - secret: {name: github, items: [{key: sds.yaml, path: github.yaml}]}
---
apiVersion: v1
kind: Service
metadata: {name: broker, namespace: dorf-broker}
spec:
  selector: {app: broker}
  ports: [{port: 80, targetPort: 8080}]
---
# Only the agent may call the broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: broker, namespace: dorf-broker}
spec:
  podSelector: {matchLabels: {app: broker}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: dorf-gate}}
      podSelector: {matchLabels: {app: dorf-agent}}
    ports: [{port: 8080}]
