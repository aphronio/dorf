# Its own namespace keeps the identity the router trusts away from the Sandboxes' pool.
apiVersion: v1
kind: Namespace
metadata:
  name: dorf-gate
  labels: {ate.dev/api-access: "true"}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: dorf-agent, namespace: dorf-gate}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: dorf-gate, namespace: dorf-gate}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: dorf-gate, namespace: dorf}
rules:
- {apiGroups: [""], resources: [pods], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dorf-gate, namespace: dorf}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dorf-gate}
subjects:
- {kind: ServiceAccount, name: dorf-gate, namespace: dorf-gate}
---
# The gate checks that a caller's token is the agent's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: dorf-gate-token-review}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects:
- {kind: ServiceAccount, name: dorf-gate, namespace: dorf-gate}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dorf-gate, namespace: dorf-gate}
spec:
  selector: {matchLabels: {app: dorf-gate}}
  template:
    metadata: {labels: {app: dorf-gate}}
    spec:
      serviceAccountName: dorf-gate
      containers:
      - name: gate
        image: ${GATE_IMAGE}
        ports: [{containerPort: 8080}]
        env:
        - {name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
        readinessProbe: {tcpSocket: {port: 8080}}
        volumeMounts:
        - {name: servicedns, mountPath: /run/ate/servicedns}
        - {name: podidentity, mountPath: /run/ate/podidentity}
        - {name: substrate, mountPath: /run/dorf/substrate, readOnly: true}
      volumes:
      - name: substrate
        projected:
          sources:
          - serviceAccountToken: {audience: api.ate-system.svc, expirationSeconds: 3600, path: token}
      - name: servicedns
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector: {matchLabels: {podcert.ate.dev/canarying: live}}
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
---
apiVersion: v1
kind: Service
metadata: {name: dorf-gate, namespace: dorf-gate}
spec:
  selector: {app: dorf-gate}
  ports: [{port: 80, targetPort: 8080}]
